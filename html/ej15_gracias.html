<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensaje Enviado</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="container text-center">
        <div class="card shadow-sm p-5 border-0 mx-auto" style="max-width: 600px;">
            
            <!-- Icono de éxito -->
            <div class="mb-4">
                <i class="fas fa-paper-plane text-success display-4"></i>
            </div>

            <!-- Mensaje principal -->
            <h1 class="h3 fw-bold mb-3">¡Consulta enviada con éxito!</h1>
            <p class="text-muted mb-4">Muchas gracias por comunicarte. Lo contactaré en breve para responder a su solicitud.</p>

            <!-- Renglón con la cuenta regresiva desde el 1 de julio de 2023 -->
            <div class="alert alert-secondary py-3 mb-4">
                <small class="d-block text-muted mb-1">Tiempo transcurrido desde el 1 de julio de 2023:</small>
                <span id="contador-tiempo" class="fw-bold fs-6">Calculando...</span>
            </div>

            <!-- Botón volver al currículum -->
            <div>
                <a href="ej15_contacto.html" class="btn btn-dark px-4">
                    <i class="fas fa-arrow-left me-2"></i> Volver al currículum
                </a>
            </div>

        </div>
    </div>

    <!-- Script de JavaScript para calcular el tiempo transcurrido -->
    <script>
        function calcularTiempoTranscurrido() {
            // Fecha de inicio: 1 de julio de 2023, 00:00:00
            const fechaInicio = new Date('2023-07-01T00:00:00');
            const ahora = new Date();

            let diferencia = ahora - fechaInicio; // en milisegundos

            if (diferencia < 0) {
                document.getElementById('contador-tiempo').innerText = "Aún no se llega a la fecha.";
                return;
            }

            // Cálculos de tiempo
            const segundos = Math.floor(diferencia / 1000);
            const minutos = Math.floor(segundos / 60);
            const horas = Math.floor(minutos / 60);
            const dias = Math.floor(horas / 24);

            // Aproximación en años, meses y días para que quede más legible
            const anos = Math.floor(dias / 365);
            const meses = Math.floor((dias % 365) / 30);
            const diasRestantes = (dias % 365) % 30;
            const horasRestantes = horas % 24;
            const minutosRestantes = minutos % 60;
            const segundosRestantes = segundos % 60;

            // Mostrar el resultado en el span
            document.getElementById('contador-tiempo').innerText = 
                `${anos} años, ${meses} meses, ${diasRestantes} días, ${horasRestantes}h ${minutosRestantes}m ${segundosRestantes}s`;
        }

        // Ejecutar al cargar y actualizar cada segundo
        calcularTiempoTranscurrido();
        setInterval(calcularTiempoTranscurrido, 1000);
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
