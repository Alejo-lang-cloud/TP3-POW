<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador de CUIL / CUIT - Trabajo Práctico</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                
                <!-- Tarjeta principal -->
                <div class="card shadow-sm border-0 p-4">
                    <div class="card-body">
                        
                        <div class="text-center mb-4">
                            <i class="fas fa-id-card text-primary display-5 mb-2"></i>
                            <h1 class="h4 fw-bold">Validador de CUIL / CUIT</h1>
                            <p class="text-muted small">Ingrese el número con o sin guiones para verificar su validez mediante Módulo 11.</p>
                        </div>

                        <!-- Formulario -->
                        <form id="form-cuit">
                            <div class="mb-3">
                                <label for="input-cuit" class="form-label fw-semibold">Número de CUIL/CUIT</label>
                                <!-- CONTENEDOR DE ENTRADA: id="input-cuit" -->
                                <input type="text" class="form-control form-control-lg" id="input-cuit" placeholder="Ej: 20-12345678-6" required>
                                <div class="form-text">Formato esperado: XX-XXXXXXXX-X</div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                                Validar CUIL/CUIT
                            </button>
                        </form>

                        <!-- CONTENEDOR DE RESULTADO: id="resultado-validacion" -->
                        <!-- Aquí tu código JavaScript podrá inyectar mensajes de verdadero/falso o error -->
                        <div id="resultado-validacion" class="mt-4 d-none">
                            <!-- Se llenará dinámicamente desde JS -->
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
