<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Trabajo Práctico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="card shadow-sm p-4 p-md-5 border-0">
            <div class="row g-5 align-items-start">
                
                <!-- COLUMNA IZQUIERDA: ubicacion, contacto y redes -->
                <div class="col-md-6">
                    <h2 class="h3 fw-bold text-uppercase mb-4">Ubicación</h2>
                    <p class="text-muted mb-4">
                        Calle 7 (Oeste) N° 479<br>
                        Facultad de Ingeniería
                    </p>

                    <!-- telefono y mail interactivos -->
                    <h3 class="h4 fw-bold text-uppercase mb-3">Contacto Directo</h3>
                    <p class="mb-2">
                        <i class="fas fa-phone me-2 text-secondary"></i>
                        <a href="tel:+11234567890" class="text-decoration-none text-dark">+54 9 2302 001102</a>
                    </p>
                    <p class="mb-4">
                        <i class="fas fa-envelope me-2 text-secondary"></i>
                        <a href="mailto:contacto@tucorreo.com" class="text-decoration-none text-dark">avm@gmail.com</a>
                    </p>

                    <h3 class="h4 fw-bold text-uppercase mb-3">Síguenos</h3>
                    <div class="d-flex gap-3 mb-4">
                        <a href="#" class="text-dark fs-5" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
                        <a href="#" class="text-dark fs-5" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
                        <a href="#" class="text-dark fs-5" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                        <a href="#" class="text-dark fs-5" aria-label="Google Plus"><i class="fab fa-google-plus-g"></i></a>
                    </div>

                    <p class="text-muted small mb-0">&copy; 2026 Formulario de Contacto</p>
                </div>

                <!-- COLUMNA DERECHA: formulario que redirige a la pagina de exito -->
                <div class="col-md-6">
                    <h2 class="h3 fw-bold mb-4">Formulario de contacto</h2>
                    
                    <!-- action apunta a la pagina de agradecimiento -->
                    <form action="ej15_gracias.html" method="GET">
                        <div class="mb-3">
                            <input type="text" class="form-control" name="nombre" placeholder="Ingrese su nombre" required>
                        </div>
                        <div class="mb-3">
                            <input type="email" class="form-control" name="email" placeholder="Ingrese su email" required>
                        </div>
                        <div class="mb-3">
                            <textarea class="form-control" name="mensaje" rows="4" placeholder="Ingrese su mensaje" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-outline-dark px-4">Enviar</button>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
