<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculador Basica</title>
    <link rel="stylesheet" href="../css/estilos_calculadora.css"/>
</head>
<body>
    <div class="contenedor-general">
        <h1>Calculadora Básica</h1>
        <div class="contenedor-display">
            <div class="contenedor-display-acum"></div>
            <div class="contenedor-display-numactual"></div>
        </div>
        <div class="teclado">
            <Button id="CE" class="boton-accion">CE</Button>
            <Button id="C" class="boton-accion">C</Button>    
            <Button id="mas_menos" class="boton-operador">±</Button>
            <Button id="porcentaje" class="boton-operador">%</Button>
            <Button id="7" class="boton-numero">7</Button>
            <Button id="8" class="boton-numero">8</Button>
            <Button id="9" class="boton-numero">9</Button>
            <Button id="division" class="boton-operador">/</Button>
            <Button id="4" class="boton-numero">4</Button>
            <Button id="5" class="boton-numero">5</Button>
            <Button id="6" class="boton-numero">6</Button>
            <Button id="multiplicacion" class="boton-operador">x</Button>
            <Button id="1" class="boton-numero">1</Button>
            <Button id="2" class="boton-numero">2</Button>
            <Button id="3" class="boton-numero">3</Button>
            <Button id="resta" class="boton-operador">-</Button>
            <Button id="0" class="boton-numero">0</Button>
            <Button id="punto" class="boton-numero">.</Button>
            <Button id="igual" class="boton-igual">=</Button>
            <Button id="suma" class="boton-operador">+</Button>
        </div>
    </div>
    <script src="../js/script_ej13.js"></script>
</body>
</html>
